name: Keep Render Backend Awake

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour.
    - cron: "2-59/5 * * * *"

  # Lets us test it manually from GitHub.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Presenter Readiness backend
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 90 \
            https://presenter-readiness-check.onrender.com/health
